<svg xmlns="http://www.w3.org/2000/svg" width="116" height="228" viewBox="642 251 116 228">
        <g>
          <!-- Ground shadow under target -->
          <ellipse cx="700" cy="462" rx="52" ry="11" fill="#090d16" fill-opacity="0.55"/>
