          <rect x="693" y="340" width="14" height="118" rx="3" fill="#78350f" stroke="#1c0a00" stroke-width="2"/>
          <!-- Horizontal cross-beam -->
          <rect x="672" y="366" width="56" height="12" rx="3" fill="#78350f" stroke="#1c0a00" stroke-width="2"/>
          <rect x="691" y="364" width="18" height="16" rx="2" fill="#eab308" stroke="#451a03" stroke-width="1.5"/>
          <!-- Lower half of woven tatami/bamboo cylinder (from y=268 down to y=356, diagonal cut at y=268!) -->
